[project]
name = "emi-voice-agent"
version = "0.1.0"
description = "Conversational EMI reminder voice agent for Lumen Finance (Pipecat)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.33",
    "opentelemetry-sdk>=1.33",
    "pipecat-ai[anthropic,cartesia,deepgram,local-smart-turn-v3,rnnoise,runner,silero,webrtc]>=1.16.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
